name: Deploy Cuerpo de Banderas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site (admin deliberately excluded)
        run: pnpm build
        env:
          NODE_ENV: production
          # VITE_ENABLE_ADMIN is intentionally left UNSET so the admin panel is
          # tree-shaken out of the production bundle.

      - name: Verify admin is excluded from the build
        run: |
          if grep -rl "__cms/write" dist/public/assets >/dev/null 2>&1; then
            echo "::error::Admin/local-CMS code leaked into the production build"; exit 1
          fi
          echo "✓ Admin panel not present in production bundle"
          echo "Custom domain: $(cat dist/public/CNAME 2>/dev/null || echo 'none')"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
